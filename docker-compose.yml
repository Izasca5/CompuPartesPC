services:
  # ── OLLAMA — servidor de modelos IA (Modo CPU) ──────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # ── OLLAMA INIT — descarga el modelo al arrancar ────────
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: >
      sh -c "
        echo '⏳ Esperando a Ollama...' &&
        until curl -sf http://ollama:11434/ > /dev/null 2>&1; do sleep 2; done &&
        echo '✅ Ollama listo. Descargando qwen2.5:7b...' &&
        ollama pull qwen2.5:7b --host http://ollama:11434 ||
        OLLAMA_HOST=http://ollama:11434 ollama pull qwen2.5:7b &&
        echo '🚀 Modelo listo!'
      "
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ── BACKEND — API Express ───────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
      - OLLAMA_URL=http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama

  # ── FRONTEND — React + Vite ─────────────────────────────
  frontend:
    build:
      context: ./mi-web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./mi-web:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  ollama_models: